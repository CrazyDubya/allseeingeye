<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AllSeeingEye Interactive Report</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jstree/3.2.1/themes/default/style.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/default.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jstree/3.2.1/jstree.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { font-family: sans-serif; }
        #container { display: flex; }
        #tree-container { width: 30%; }
        #content-container { width: 70%; padding-left: 20px; }
        .tab { overflow: hidden; border: 1px solid #ccc; background-color: #f1f1f1; }
        .tab button { background-color: inherit; float: left; border: none; outline: none; cursor: pointer; padding: 14px 16px; transition: 0.3s; }
        .tab button:hover { background-color: #ddd; }
        .tab button.active { background-color: #ccc; }
        .tabcontent { display: none; padding: 6px 12px; border: 1px solid #ccc; border-top: none; }
    </style>
</head>
<body>
    <h1>AllSeeingEye Interactive Report</h1>
    <div id="container">
        <div id="tree-container">
            <div id="tree"></div>
        </div>
        <div id="content-container">
            <div class="tab">
                <button class="tablinks" onclick="openTab(event, 'summary')" id="defaultOpen">Summary</button>
                <button class="tablinks" onclick="openTab(event, 'content')">Content</button>
                <button class="tablinks" onclick="openTab(event, 'deps')">Dependencies</button>
                <button class="tablinks" onclick="openTab(event, 'treemap')">Treemap</button>
            </div>

            <div id="summary" class="tabcontent">
                <h2 id="summary-filename"></h2>
                <p id="summary-content"></p>
            </div>

            <div id="content" class="tabcontent">
                <h2 id="content-filename"></h2>
                <pre><code id="code-content" class="python"></code></pre>
            </div>

            <div id="deps" class="tabcontent">
                <svg id="deps-svg"></svg>
            </div>

            <div id="treemap" class="tabcontent">
                <svg id="treemap-svg"></svg>
            </div>
        </div>
    </div>

    <script>
        const data = __DATA__;

        // Tree view
        function buildTreeData(files) {
            const treeData = [];
            const pathMap = {};

            for (const category in files) {
                for (const filepath in files[category]) {
                    const parts = filepath.split('/');
                    let currentLevel = treeData;
                    let currentPath = '';

                    for (let i = 0; i < parts.length; i++) {
                        const part = parts[i];
                        currentPath += (i > 0 ? '/' : '') + part;

                        let node = pathMap[currentPath];
                        if (!node) {
                            node = {
                                id: currentPath,
                                text: part,
                                children: i < parts.length - 1 ? [] : null
                            };
                            if (i < parts.length - 1) {
                                node.type = 'directory';
                            } else {
                                node.type = 'file';
                                node.li_attr = { 'data-filepath': filepath, 'data-category': category };
                            }
                            pathMap[currentPath] = node;
                            currentLevel.push(node);
                        }

                        if (node.children) {
                            currentLevel = node.children;
                        }
                    }
                }
            }
            return treeData;
        }

        const treeData = buildTreeData(data.files_content);
        $('#tree').jstree({
            'core': {
                'data': treeData
            }
        }).on('select_node.jstree', function (e, data) {
            const node = data.node;
            if (node.type === 'file') {
                const filepath = node.li_attr['data-filepath'];
                const category = node.li_attr['data-category'];
                const fileInfo = window.data.files_content[category][filepath];

                // Update summary tab
                $('#summary-filename').text(filepath);
                $('#summary-content').text(fileInfo.summary || 'No summary available.');

                // Update content tab
                $('#content-filename').text(filepath);
                $('#code-content').text(fileInfo.content);
                hljs.highlightElement($('#code-content')[0]);
            }
        });

        // Tabs
        function openTab(evt, tabName) {
            var i, tabcontent, tablinks;
            tabcontent = document.getElementsByClassName("tabcontent");
            for (i = 0; i < tabcontent.length; i++) {
                tabcontent[i].style.display = "none";
            }
            tablinks = document.getElementsByClassName("tablinks");
            for (i = 0; i < tablinks.length; i++) {
                tablinks[i].className = tablinks[i].className.replace(" active", "");
            }
            document.getElementById(tabName).style.display = "block";
            evt.currentTarget.className += " active";
        }
        document.getElementById("defaultOpen").click();

        // Visualizations
        const width = 800;
        const height = 600;

        // Dependency graph
        const depsSvg = d3.select("#deps-svg").attr("width", width).attr("height", height);
        // ... (D3 code for dependency graph from src/visualization/dependency_graph.py) ...

        // Treemap
        const treemapSvg = d3.select("#treemap-svg").attr("width", width).attr("height", height);
        // ... (D3 code for treemap from src/visualization/codebase_structure.py) ...

    </script>
</body>
</html>
