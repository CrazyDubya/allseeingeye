<?xml version="1.0" encoding="UTF-8"?>
<svg width="800px" height="800px" viewBox="0 0 800 800" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="eyeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6a5acd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9370db;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="pupilGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#000;stop-opacity:1" />
      <stop offset="85%" style="stop-color:#000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#333;stop-opacity:1" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Main eye shape -->
  <ellipse cx="400" cy="400" rx="350" ry="250" fill="white" stroke="url(#eyeGradient)" stroke-width="15" />
  
  <!-- Iris -->
  <circle cx="400" cy="400" r="150" fill="url(#eyeGradient)" filter="url(#glow)" />
  
  <!-- Pupil -->
  <circle cx="400" cy="400" r="75" fill="url(#pupilGradient)" />
  
  <!-- Reflection highlight -->
  <circle cx="350" cy="350" r="25" fill="white" opacity="0.8" />
  <circle cx="380" cy="380" r="10" fill="white" opacity="0.6" />
  
  <!-- Eyelashes -->
  <g stroke="url(#eyeGradient)" stroke-width="8" stroke-linecap="round">
    <!-- Top eyelashes -->
    <line x1="180" y1="300" x2="160" y2="250" />
    <line x1="260" y1="230" x2="240" y2="180" />
    <line x1="340" y1="200" x2="330" y2="150" />
    <line x1="400" y1="190" x2="400" y2="140" />
    <line x1="460" y1="200" x2="470" y2="150" />
    <line x1="540" y1="230" x2="560" y2="180" />
    <line x1="620" y1="300" x2="640" y2="250" />
    
    <!-- Bottom eyelashes -->
    <line x1="180" y1="500" x2="160" y2="550" />
    <line x1="260" y1="570" x2="240" y2="620" />
    <line x1="340" y1="600" x2="330" y2="650" />
    <line x1="400" y1="610" x2="400" y2="660" />
    <line x1="460" y1="600" x2="470" y2="650" />
    <line x1="540" y1="570" x2="560" y2="620" />
    <line x1="620" y1="500" x2="640" y2="550" />
  </g>
</svg>