name: AllSeeingEye Codebase Analysis

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0  # Fetch all history for better analysis
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install AllSeeingEye
      run: |
        python -m pip install --upgrade pip
        pip install -e .
    
    - name: Run AllSeeingEye Analysis
      run: |
        # Use the Python API for flexibility
        python -c "
import os
import json
from src.integrations.ci_cd import GitHubActionsIntegration

# Initialize integration
integration = GitHubActionsIntegration(
    base_url=os.environ.get('ASE_API_URL', 'http://localhost:8000'),
    api_key=os.environ.get('ASE_API_KEY'),
    github_token=os.environ.get('GITHUB_TOKEN')
)

# Run analysis locally
from src.core.analyzer import EfficientAnalyzer
analyzer = EfficientAnalyzer(
    directory='.',
    excluded_dirs=['.git', '.github', 'node_modules', '__pycache__', '.venv'],
    output_format='json',
    max_workers=4
)

# Process analysis
output_file = analyzer.run()

# Load results for reporting
with open(output_file, 'r') as f:
    result = json.load(f)

# Post comment on PR if this is a pull request
is_pr = os.environ.get('GITHUB_EVENT_NAME') == 'pull_request'
pr_number = None

if is_pr:
    # Extract PR number from GITHUB_REF
    ref = os.environ.get('GITHUB_REF', '')
    if 'pull/' in ref:
        try:
            pr_number = int(ref.split('/')[2])
        except (IndexError, ValueError):
            print('Could not determine PR number from GITHUB_REF')
    
    # Post results as PR comment
    if pr_number:
        # Create mock result structure for the integration function
        mock_result = {
            'task_id': 'local-analysis',
            'result': result
        }
        
        integration.post_analysis_comment(
            result=mock_result,
            pr_number=pr_number,
            include_details=True
        )
        print(f'Posted analysis results as comment on PR #{pr_number}')

# Save results as artifact
with open('allseeingeye_analysis.json', 'w') as f:
    json.dump(result, f, indent=2)
print('Analysis results saved to allseeingeye_analysis.json')
"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        ASE_API_URL: ${{ secrets.ASE_API_URL }}
        ASE_API_KEY: ${{ secrets.ASE_API_KEY }}
    
    - name: Upload analysis results
      uses: actions/upload-artifact@v3
      with:
        name: allseeingeye-analysis
        path: allseeingeye_analysis.json
